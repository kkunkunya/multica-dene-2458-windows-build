name: Windows package v0.6.6-test.1
run-name: Windows package v0.6.6-test.1

on:
  push:
    tags:
      - v0.6.6-test.1

permissions:
  contents: read

concurrency:
  group: windows-package-v0.6.6-test.1
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the approved source tag
        uses: actions/checkout@v4
        with:
          repository: jeff-kunkun/multica
          ref: v0.6.6-test.1
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact source commit and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "e19233c0d7fd9fae8ab583c59fec2a2bfa4b95bf"
          test "$(git -C source describe --tags --exact-match HEAD)" = "v0.6.6-test.1"
          echo "Source commit: $(git -C source rev-parse HEAD)"
          echo "Source version: $(git -C source describe --tags --exact-match HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: source/server/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm -C source install --frozen-lockfile

      - name: Build Windows x64 and ARM64 installers without publishing
        working-directory: source/apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --win --x64 --arm64 --publish never

      - name: Check installers and record checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/installers
          cp source/apps/desktop/dist/win-x64/multica-desktop-0.6.6-test.1-windows-x64.exe source/installers/
          cp source/apps/desktop/dist/win-arm64/multica-desktop-0.6.6-test.1-windows-arm64.exe source/installers/
          (cd source/installers && sha256sum *.exe > SHA256SUMS.txt)
          cat source/installers/SHA256SUMS.txt

      - name: Upload temporary download files
        uses: actions/upload-artifact@v4
        with:
          name: Multica-Windows-0.6.6-test.1
          path: |
            source/installers/*.exe
            source/installers/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
